<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque Fácil</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div>
      <h1>Estoque Fácil</h1>
      <p>Cadastro e controle de produtos</p>
    </div>
  </header>

  
  <main class="layout">

    <section class="card card-formulario">
      <h2 id="titulo-form">Cadastrar produto</h2>

      <form id="produto-form">
        <input type="hidden" id="produto-id">

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Ex.: Martelo" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" placeholder="Ex.: Ferramentas" required>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="preco">Preço</label>
            <input type="number" id="preco" min="0" step="0.01" placeholder="0,00" required>
          </div>

          <div class="campo">
            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" min="0" step="1" placeholder="0" required>
          </div>
        </div>

        <div class="botoes">
          <button type="submit" class="btn-principal" id="btn-salvar">
            Cadastrar
          </button>

          <button type="button" class="btn-cancelar" id="btn-cancelar" onclick="cancelarEdicao()" hidden>
            Cancelar
          </button>
        </div>
      </form>

      <p id="mensagem"></p>
    </section>

    <section class="card card-produtos">
      <div class="titulo-lista">
        <div>
          <h2>Produtos cadastrados</h2>
          <p id="contador">0 produtos</p>
        </div>

        <button class="btn-atualizar" onclick="carregarProdutos()">
          Atualizar lista
        </button>
      </div>

      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="lista-produtos"></tbody>
        </table>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>

</html>
